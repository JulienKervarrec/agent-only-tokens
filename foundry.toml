[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib", "node_modules"]
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
remappings = [
  "@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/",
  "forge-std/=lib/forge-std/src/",
]

# Read access to the official Uniswap V3 artifacts, for the tests.
fs_permissions = [{ access = "read", path = "./node_modules/@uniswap" }]

[fuzz]
runs = 512

[invariant]
runs = 128
depth = 100
fail_on_revert = false
