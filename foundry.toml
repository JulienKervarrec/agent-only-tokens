[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib", "node_modules"]
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
remappings = [
  "@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/",
  "forge-std/=lib/forge-std/src/",
]

# Read access to the official Uniswap V3 artifacts, to the compiled USDC contract and to the
# sample Intel TDX quote, for the tests.
fs_permissions = [
    { access = "read", path = "./node_modules/@uniswap" },
    { access = "read", path = "./test/usdc" },
    { access = "read", path = "./test/experimental/tdx" },
    { access = "read", path = "./test/experimental/dstack" },
    { access = "read", path = "./test/experimental/phala" },
]

[fuzz]
runs = 512

[invariant]
runs = 128
depth = 100
fail_on_revert = false
