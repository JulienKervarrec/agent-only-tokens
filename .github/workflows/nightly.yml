name: nightly

# Every night: the tests that need the real chain, and the code at every recorded address.
# They tell us when Automata's verifier, Intel's collateral or a deployed contract changes.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fork:
    name: Tests against Base Sepolia
    runs-on: ubuntu-latest
    env:
      BASE_SEPOLIA_RPC: https://sepolia.base.org
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.1
      - run: git clone --depth 1 --branch v1.9.7 https://github.com/foundry-rs/forge-std lib/forge-std
      - run: forge test --match-path 'test/fork/*'
        env:
          FOUNDRY_EVM_VERSION: osaka
      - name: Code at every recorded address
        run: python3 tools/deployments.py --rpc "$BASE_SEPOLIA_RPC"
      # Intel's data on chain expires about monthly; fails 3 days before a quote would be refused.
      - name: Intel's data behind the DCAP verifier
        run: python3 tools/collateral.py --rpc "$BASE_SEPOLIA_RPC" --warn-days 3
      # Base mainnet, for step 6.5: on 18 November 2026 our quotes were refused there ("QEIDVE",
      # the Intel data of the TDX quoting enclave is missing). Reported every night, never fails.
      - name: Base mainnet readiness (report only)
        continue-on-error: true
        run: python3 tools/collateral.py --rpc https://mainnet.base.org --warn-days 3

  image:
    name: dstack image against our quotes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # The production images that ran our agents (dstack OS 0.5.12, then 0.5.15 from the fifth
      # program on), as dstack published them.
      - name: Download the images
        run: |
          fetch() {
            curl -sSfL -o /tmp/dstack-$1.tar.gz https://github.com/Dstack-TEE/meta-dstack/releases/download/v$1/dstack-$1.tar.gz
            echo "$2  /tmp/dstack-$1.tar.gz" | sha256sum -c
            tar -xzf /tmp/dstack-$1.tar.gz -C /tmp
          }
          fetch 0.5.12 e3037d99d99ec963bbe43929856c1e46e7197a1178da5867024c4b68064eb176
          fetch 0.5.15 6f74f48f6d7aaf6fd17b952cd556f6709a70a5eb5c36086e3478b9bafa723a52
      - name: MRTD, RTMR1 and RTMR2 of every quote we archived equal one of the two images
        run: python3 tools/dstack_image.py /tmp/dstack-0.5.12 /tmp/dstack-0.5.15 test/experimental/phala/quote*.hex examples/enclave-agent/run-*/quote*.hex
      - name: Each root file system matches the hash in its measured command line
        run: |
          sudo apt-get install -y -qq cryptsetup-bin
          for v in 0.5.12 0.5.15; do
            hash=$(python3 -c "import json,re,sys;print(re.search(r'dstack.rootfs_hash=(\w+)',json.load(open(sys.argv[1]))['cmdline'])[1])" /tmp/dstack-$v/metadata.json)
            size=$(python3 -c "import json,re,sys;print(re.search(r'dstack.rootfs_size=(\d+)',json.load(open(sys.argv[1]))['cmdline'])[1])" /tmp/dstack-$v/metadata.json)
            veritysetup verify /tmp/dstack-$v/rootfs.img.verity /tmp/dstack-$v/rootfs.img.verity "$hash" --hash-offset="$size"
          done
