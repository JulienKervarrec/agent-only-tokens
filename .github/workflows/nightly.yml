name: nightly

# Every night: the tests that need the real chain, and the code at every recorded address.
# They tell us when Automata's verifier, Intel's collateral or a deployed contract changes.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fork:
    name: Tests against Base Sepolia
    runs-on: ubuntu-latest
    env:
      BASE_SEPOLIA_RPC: https://sepolia.base.org
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.1
      - run: git clone --depth 1 --branch v1.9.7 https://github.com/foundry-rs/forge-std lib/forge-std
      - run: forge test --match-path 'test/fork/*'
        env:
          FOUNDRY_EVM_VERSION: osaka
      - name: Code at every recorded address
        run: python3 tools/deployments.py --rpc "$BASE_SEPOLIA_RPC"

  image:
    name: dstack image against our quotes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The production image that ran our agents (dstack OS 0.5.12), as dstack published it.
      - name: Download the image
        run: |
          curl -sSfL -o /tmp/dstack.tar.gz https://github.com/Dstack-TEE/meta-dstack/releases/download/v0.5.12/dstack-0.5.12.tar.gz
          echo "e3037d99d99ec963bbe43929856c1e46e7197a1178da5867024c4b68064eb176  /tmp/dstack.tar.gz" | sha256sum -c
          tar -xzf /tmp/dstack.tar.gz -C /tmp
      - name: MRTD, RTMR1 and RTMR2 of every quote we archived
        run: python3 tools/dstack_image.py /tmp/dstack-0.5.12 test/experimental/phala/quote*.hex examples/enclave-agent/run-*/quote*.hex
      - name: The root file system matches the hash in the measured command line
        run: |
          sudo apt-get install -y -qq cryptsetup-bin
          hash=$(python3 -c "import json,re;print(re.search(r'dstack.rootfs_hash=(\w+)',json.load(open('/tmp/dstack-0.5.12/metadata.json'))['cmdline'])[1])")
          size=$(python3 -c "import json,re;print(re.search(r'dstack.rootfs_size=(\d+)',json.load(open('/tmp/dstack-0.5.12/metadata.json'))['cmdline'])[1])")
          veritysetup verify /tmp/dstack-0.5.12/rootfs.img.verity /tmp/dstack-0.5.12/rootfs.img.verity "$hash" --hash-offset="$size"
