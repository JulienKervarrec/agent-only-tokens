name: weekly

# Every week: mutation testing. Each security check is broken in turn; the test suite must
# notice every time (tools/mutate.py). About half an hour.
on:
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutation:
    name: Mutation testing
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.1
      - run: git clone --depth 1 --branch v1.9.7 https://github.com/foundry-rs/forge-std lib/forge-std
      - run: python3 tools/mutate.py --jobs 4
