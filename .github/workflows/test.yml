name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  forge:
    name: Foundry tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.1
      - run: git clone --depth 1 --branch v1.9.7 https://github.com/foundry-rs/forge-std lib/forge-std
      - run: forge fmt --check src
      - run: forge test
      - name: Recorded data matches its SHA256SUMS
        run: python3 tools/datasets.py --check
      - name: Conformance suite catches each faulty implementation
        run: python3 tools/conformance.py
      - name: ERC text, its reference implementation and the self-contained suite
        run: python3 tools/erc_package.py "$RUNNER_TEMP/erc" --check
      - name: Registry monitor page, built from its template and checked
        run: python3 tools/monitor_page.py --check
      - name: Fourth agent program, end to end on a local chain
        run: bash examples/enclave-agent/v4/local/run.sh
      - name: Fifth agent program (model decisions, stand-in gateway), local chain
        run: bash examples/enclave-agent/v5/local/run.sh
      - name: Incident drill of docs/operations.md, on a local chain
        run: bash examples/operations/drill.sh
      - name: Gas of each operation, against snapshots/Gas.json
        run: |
          rm snapshots/Gas.json
          forge test --isolate --match-contract GasTest
          git diff --exit-code snapshots/Gas.json
      - name: Figures quoted in the documentation
        run: python3 tools/figures.py
      - name: Addresses cited in the documentation
        run: python3 tools/deployments.py

  halmos:
    name: Symbolic proofs (Halmos)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.1
      - run: git clone --depth 1 --branch v1.9.7 https://github.com/foundry-rs/forge-std lib/forge-std
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install halmos==0.3.3
      - run: halmos --match-contract "AgentOnlyProps|RegistryProps|LoanProps|AllowanceProps|AccountProps"

  slither:
    name: Static analysis (Slither)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.1
      - run: git clone --depth 1 --branch v1.9.7 https://github.com/foundry-rs/forge-std lib/forge-std
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install slither-analyzer==0.11.6
      - run: forge build --build-info --skip test --skip script
      # Slither exits with an error as soon as it reports anything: the next step decides.
      - run: >-
          slither . --ignore-compile --compile-force-framework foundry
          --filter-paths "node_modules/|/lib/|/test/|/test-faulty/" --json slither.json || true
      - name: Findings against the accepted list
        run: python3 tools/slither_check.py slither.json
